<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Create Account — JobsNow</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
</head>
<body>
<header class="header">
  <div class="container header-inner">
    <a href="index.html" class="logo">Jobs<span>Now</span></a>
  </div>
</header>

<div class="auth-page">
  <div class="auth-card wide">
    <h2>Create your free account</h2>
    <p class="auth-sub">Already have an account? <a href="signin.html">Sign in</a></p>

    <div class="account-type-tabs">
      <button class="tab-btn active" onclick="switchTab('seeker', this)">Job Seeker</button>
      <button class="tab-btn" onclick="switchTab('employer', this)">Employer</button>
    </div>

    <form class="auth-form" id="seekerForm" onsubmit="return false;">
      <div class="form-row">
        <div class="form-group">
          <label>First Name</label>
          <input type="text" placeholder="John"/>
        </div>
        <div class="form-group">
          <label>Last Name</label>
          <input type="text" placeholder="Doe"/>
        </div>
      </div>
      <div class="form-group">
        <label>Email address</label>
        <input type="email" placeholder="you@example.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Min 8 characters"/>
      </div>
      <div class="form-group">
        <label>Job Title / What are you looking for?</label>
        <input type="text" placeholder="e.g. Software Engineer, Marketing Manager"/>
      </div>
      <div class="form-group">
        <label>Location</label>
        <input type="text" placeholder="City, State"/>
      </div>
      <button class="btn btn-primary btn-full">Create Account</button>
      <p class="terms-text">By creating an account, you agree to our <a href="terms.html">Terms</a> and <a href="privacy.html">Privacy Policy</a>.</p>
    </form>

    <form class="auth-form hidden" id="employerForm" onsubmit="return false;">
      <div class="form-group">
        <label>Company Name</label>
        <input type="text" placeholder="Acme Corp"/>
      </div>
      <div class="form-group">
        <label>Work Email</label>
        <input type="email" placeholder="hr@company.com"/>
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" placeholder="Min 8 characters"/>
      </div>
      <div class="form-group">
        <label>Company Size</label>
        <select>
          <option>1–10 employees</option>
          <option>11–50 employees</option>
          <option>51–200 employees</option>
          <option>201–1000 employees</option>
          <option>1000+ employees</option>
        </select>
      </div>
      <button class="btn btn-primary btn-full">Create Employer Account</button>
    </form>
  </div>
</div>

<script src="app.js"></script>
<script>
function switchTab(type, el) {
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('seekerForm').classList.toggle('hidden', type !== 'seeker');
  document.getElementById('employerForm').classList.toggle('hidden', type !== 'employer');
}
</script>
</body>
</html>
